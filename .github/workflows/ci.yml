name: Terraform CI

on:
  push:
    branches: [ main ] # update to 'main' while testing
  pull_request:

permissions:
  contents: write  # required for auto-commit/push
  id-token: write
  issues: write
  pull-requests: write
  security-events: write
  
jobs:
  sca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true  # so GITHUB_TOKEN works for push

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0  # matches the version baked into the action image

      - name: Run TFLint to JSON (and SARIF)
        run: |
          mkdir -p input
          # Initialize if you use TFLint plugins/rulesets (optional but recommended)
          tflint --init || true
          # JSON for our action to ingest
          tflint --recursive --format json > input/tflint.json || true
          # Native SARIF (optional, our action can also convert)
          tflint --recursive --format sarif > input/tflint.sarif || true

      - name: Setup Python for Checkov
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and run Checkov
        run: |
          pip install --no-cache-dir checkov==3.2.125
          checkov -d . -o json --output-file-path input/checkov.json || true
          checkov -d . -o sarif --output-file-path input/checkov.sarif || true

      - name: AIOps SCA Agent
        uses: aiops-agents/aiops-sca@main
        with:
          enable: true
          scope: '["infra/**/*.tf"]'
          input_dir: "./input"
          output_dir: "./output"
          llm_provider: "azure_openai"
          llm_model: "gpt-4o-mini"
          show_recommendation: true
          auto_apply: true
          lint_format: "auto"
          apply_mode: "pr"                # dry-run or pr, pr for open a PR with changes
          pr_title: "AIOps SCA: Terraform fixes"
          pr_body: "Automated changes by AIOps SCA. Please review."
          max_lines_changed: "200"
          max_files_changed: "10"
          protected_paths: '["infra/modules/vendor/**"]'
          recommendation_format: "markdown"
          fail_on_unfixed: "false"
          commit_message_prefix: "[aiops-sca]"
          git_user_name: "aiops-sca[bot]"
          git_user_email: "aiops-sca-bot@example.com"
          lint_retry_on_failure: "true"
          allow_severities: '["medium","high","critical","error"]'
          exclude_rules: '["AWS001","terraform_required_providers"]'
          max_token_context_bytes: "0"
          audit_log: "true"
          re_lint_after_apply: "true"
          re_lint_cmd: 'tflint --recursive --format json > output/re_lint.json || true'
          re_lint_output_glob: "output/re_lint.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: "2024-06-01"
